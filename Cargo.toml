[package]
name = "youtube_mp4_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
rfd = "0.17.2"
serde_json = "1"
ureq = { version = "3.4.2", features = ["win-system-proxy"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
